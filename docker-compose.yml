services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-interview-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: ai-interview-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_interview
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 8080
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      FRONTEND_URL: http://localhost:3001
      BACKEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://host.docker.internal:3001,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/migrations:/app/migrations

  frontend:
    build: ./frontend
    container_name: ai-interview-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
